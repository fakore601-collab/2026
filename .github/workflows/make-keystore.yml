name: Make keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate signing key and private setup file
        shell: bash
        run: |
          set -euo pipefail
          store_password="$(openssl rand -hex 32)"
          key_password="$(openssl rand -hex 32)"
          keystore_path="$RUNNER_TEMP/ard.jks"
          secrets_file="$RUNNER_TEMP/ard-keystore-secrets.txt"

          echo "::add-mask::$store_password"
          echo "::add-mask::$key_password"

          keytool -genkeypair \
            -keystore "$keystore_path" \
            -storetype JKS \
            -storepass "$store_password" \
            -keypass "$key_password" \
            -alias ard \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Ard Release, OU=Mobile, O=Ard, L=Unknown, ST=Unknown, C=US"

          keystore_base64="$(base64 --wrap=0 "$keystore_path")"
          echo "::add-mask::$keystore_base64"

          {
            printf 'KEYSTORE_BASE64=%s\n' "$keystore_base64"
            printf 'KEYSTORE_PASSWORD=%s\n' "$store_password"
            printf 'KEY_ALIAS=ard\n'
            printf 'KEY_PASSWORD=%s\n' "$key_password"
          } > "$secrets_file"

      - name: Upload private setup file
        uses: actions/upload-artifact@v4
        with:
          name: Ard-keystore-setup
          path: ${{ runner.temp }}/ard-keystore-secrets.txt
          if-no-files-found: error
          retention-days: 7
