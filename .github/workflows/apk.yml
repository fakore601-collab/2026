name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Install Android dependencies
        working-directory: apps/wordcraft-android
        run: npm install

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build web app
        working-directory: apps/wordcraft-web
        run: trunk build --release

      - name: Sync Capacitor Android project
        working-directory: apps/wordcraft-android
        run: npm run android:sync

      - name: Build debug APK
        working-directory: apps/wordcraft-android
        run: npm run android:apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ard-debug
          path: apps/wordcraft-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Check release signing secrets
        id: release_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          count=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$value" ]; then
              count=$((count + 1))
            fi
          done
          if [ "$count" -ne 0 ] && [ "$count" -ne 4 ]; then
            echo "Configure all four release signing secrets, or leave all four unset." >&2
            exit 1
          fi
          if [ "$count" -eq 4 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; the debug APK is available, release build skipped."
          fi

      - name: Decode release keystore
        if: steps.release_secrets.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ard-release.jks"

      - name: Build release APK
        if: steps.release_secrets.outputs.configured == 'true'
        working-directory: apps/wordcraft-android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ard-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: cd android && ./gradlew assembleRelease

      - name: Name release APK
        if: steps.release_secrets.outputs.configured == 'true'
        run: |
          cp apps/wordcraft-android/android/app/build/outputs/apk/release/app-release.apk \
            apps/wordcraft-android/android/app/build/outputs/apk/release/Ard-release.apk

      - name: Upload release APK
        if: steps.release_secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Ard-release
          path: apps/wordcraft-android/android/app/build/outputs/apk/release/Ard-release.apk
          if-no-files-found: error
