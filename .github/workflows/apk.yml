name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      # Tests are advisory: a failing test must not block the APK build.
      - name: Run unit tests
        continue-on-error: true
        run: cargo test --workspace --exclude wordcraft-web

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0

      - name: Install Android dependencies
        working-directory: apps/wordcraft-android
        run: npm install

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build web app
        working-directory: apps/wordcraft-web
        run: trunk build --release

      - name: Sync Capacitor Android project
        working-directory: apps/wordcraft-android
        run: npm run android:sync

      - name: Ensure Gradle wrapper is executable
        run: chmod +x apps/wordcraft-android/android/gradlew

      - name: Build debug APK
        working-directory: apps/wordcraft-android
        run: npm run android:apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ard-debug
          path: apps/wordcraft-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Check release signing secrets
        id: release_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          count=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -n "$value" ]; then
              count=$((count + 1))
            fi
          done
          if [ "$count" -ne 0 ] && [ "$count" -ne 4 ]; then
            echo "Configure all four release signing secrets, or leave all four unset." >&2
            exit 1
          fi
          if [ "$count" -eq 4 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; the debug APK is available, release build skipped."
          fi

      - name: Decode release keystore
        if: steps.release_secrets.outputs.configured == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ard-release.jks"

      - name: Build release APK
        if: steps.release_secrets.outputs.configured == 'true'
        working-directory: apps/wordcraft-android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ard-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: cd android && ./gradlew assembleRelease

      - name: Name release APK
        if: steps.release_secrets.outputs.configured == 'true'
        run: |
          cp apps/wordcraft-android/android/app/build/outputs/apk/release/app-release.apk \
            apps/wordcraft-android/android/app/build/outputs/apk/release/Ard-release.apk

      - name: Upload release APK
        if: steps.release_secrets.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Ard-release
          path: apps/wordcraft-android/android/app/build/outputs/apk/release/Ard-release.apk
          if-no-files-found: error

      - name: Select APK for Release
        id: release_asset
        run: |
          if [ -f apps/wordcraft-android/android/app/build/outputs/apk/release/Ard-release.apk ]; then
            echo "path=apps/wordcraft-android/android/app/build/outputs/apk/release/Ard-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=Ard-release.apk" >> "$GITHUB_OUTPUT"
          else
            DEBUG_APK=$(ls apps/wordcraft-android/android/app/build/outputs/apk/debug/*.apk | head -n 1)
            cp "$DEBUG_APK" apps/wordcraft-android/android/app/build/outputs/apk/debug/Ard-debug.apk
            echo "path=apps/wordcraft-android/android/app/build/outputs/apk/debug/Ard-debug.apk" >> "$GITHUB_OUTPUT"
            echo "name=Ard-debug.apk" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: أرض v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: ${{ steps.release_asset.outputs.path }}
          body: |
            ## تطبيق أرض (Ard) — الإصدار v1.0.${{ github.run_number }}
            
            ### المميزات في هذا الإصدار:
            - **حفظ تلقائي ذكي**: حفظ بعد 3 ثوانٍ من آخر تعديل، وفوراً عند الانتقال للخلفية (`pause` / `visibilitychange`) وقبل الخروج.
            - **تخزين دائم ذري**: كتابة الملفات بآلية ذرية في مساحة التطبيق مع إنشاء نسخة احتياطية `.bak` تلقائياً واسترجاعها في حال تلف الملف.
            - **استرجاع تلقائي**: فتح آخر مستند تلقائياً مع تنبيه "تم استرجاع عملك" بعد أي إغلاق غير سليم.
            - **شاشة إدارة المستندات**: قائمة بالمستندات المحفوظة بتاريخ التعديل وحجم الملف، إنشاء جديد، فتح، إعادة تسمية، وحذف بتأكيد.
            - **مشاركة وتصدير**: تصدير ومشاركة المستندات بصيغتي DOCX و PDF عبر أندرويد.
            - **دعم زر الرجوع**: إغلاق القوائم والنوافذ أولاً، ثم الحفظ والرجوع لقائمة المستندات، ثم الخروج بأمان.
